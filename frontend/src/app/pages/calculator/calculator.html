<main class="calculator-page">
  <nav class="calculator-nav">
    <button class="back-button" type="button" (click)="onBack()">
      ← Volver
    </button>
  </nav>

  <!-- FORMULARIO PRINCIPAL -->
  <form class="calculator-page__container" (submit)="$event.preventDefault()">

    <header class="calculator-page__header">
      <h1>Calculadora de vinilos</h1>
    </header>

    <!-- SECCIÓN: DIMENSIONES -->
    <fieldset class="calculator-section">
      <legend class="calculator-section__title">Dimensiones</legend>

      <section class="calculator-section__row calculator-section__row--inline" aria-label="Controles de dimensiones">
        <!-- Input Ancho -->
        <label class="calculator-input-wrapper">
          <span class="calculator-input-label">Ancho</span>
          <input
            #inputAncho
            type="number"
            min="0"
            class="calculator-input-field"
            [class.calculator-input-field--error]="mostrarErrores() && calc.ancho() === 0"
            [value]="calc.ancho()"
            (input)="updateAncho(inputAncho.value)"
            placeholder="0"
            required>
        </label>

        <!-- Input Alto -->
        <label class="calculator-input-wrapper">
          <span class="calculator-input-label">Alto</span>
          <input
            #inputAlto
            type="number"
            min="0"
            class="calculator-input-field"
            [class.calculator-input-field--error]="mostrarErrores() && calc.alto() === 0"
            [value]="calc.alto()"
            (input)="updateAlto(inputAlto.value)"
            placeholder="0"
            required>
        </label>

        <!-- Mensaje de error -->
        @if (mostrarErrores()) {
          <p class="calculator-error-message" role="alert">
            Por favor, introduce medidas válidas (mayores que 0).
          </p>
        }

        <!-- BOTÓN UNIDAD -->
        <button class="calculator-chip calculator-chip--select" type="button" (click)="toggleUnidad()">
          {{ calc.unidad() }} ▾
        </button>
      </section>
    </fieldset>

    <!-- SECCIÓN: TIPO DE VINILO -->
    <fieldset class="calculator-section">
      <legend class="calculator-section__title">Tipo de vinilo</legend>

      <section class="calculator-section__row" aria-label="Selección de material">
        <button
          class="calculator-chip"
          [class.calculator-chip--active]="calc.material() === 'monomerico'"
          (click)="calc.material.set('monomerico')"
          type="button">
          Monomérico
        </button>

        <button
          class="calculator-chip"
          [class.calculator-chip--active]="calc.material() === 'polimerico'"
          (click)="calc.material.set('polimerico')"
          type="button">
          Polimérico
        </button>

        <button
          class="calculator-chip"
          [class.calculator-chip--active]="calc.material() === 'transparente'"
          (click)="calc.material.set('transparente')"
          type="button">
          Transparente
        </button>
      </section>
    </fieldset>

    <!-- SECCIÓN: PERSONALIZACIÓN -->
    <section class="calculator-section">
      <h2 class="calculator-section__title">Personalización</h2>

      <!-- TIPO DE CORTE -->
      <fieldset class="calculator-subsection">
        <legend class="calculator-subtitle">Tipo de corte</legend>
        <div class="calculator-section__row">
          <button class="calculator-chip"
                  [class.calculator-chip--active]="calc.corte() === 'recto'"
                  (click)="calc.corte.set('recto')"
                  type="button">Recto</button>

          <button class="calculator-chip"
                  [class.calculator-chip--active]="calc.corte() === 'contorno'"
                  (click)="calc.corte.set('contorno')"
                  type="button">Contorno</button>
        </div>
      </fieldset>

      <!-- ADHESIVO -->
      <fieldset class="calculator-subsection" style="margin-top: 1rem;">
        <legend class="calculator-subtitle">Adhesivo</legend>
        <div class="calculator-section__row">
          <button class="calculator-chip"
                  [class.calculator-chip--active]="calc.adhesivo() === 'normal'"
                  (click)="calc.adhesivo.set('normal')"
                  type="button">Normal</button>

          <button class="calculator-chip"
                  [class.calculator-chip--active]="calc.adhesivo() === 'extra'"
                  (click)="calc.adhesivo.set('extra')"
                  type="button">Extra Fuerte</button>
        </div>
      </fieldset>
    </section>

    <!-- SECCIÓN: EXTRAS -->
    <fieldset class="calculator-section">
      <legend class="calculator-section__title">Ubicación y Extras</legend>

      <section class="calculator-section__row calculator-section__row--column">

        <!-- SELECTOR DE PAÍS -->
        <label class="calculator-input-wrapper">
          <span class="calculator-input-label">Destino del envío</span>
          <select
            class="calculator-select"
            [ngModel]="calc.pais()"
            (ngModelChange)="calc.pais.set($event)"
            name="paisSelector">
            <option value="ES">España (Península y Baleares) - 21% IVA</option>
            <option value="PT">Portugal - 23% IVA</option>
            <option value="CANARIAS">Canarias - Exento de IVA (IGIC)</option>
          </select>
        </label>

        <div class="calculator-section__row calculator-section__row--inline">
          <!-- Checkbox IVA -->
          <label class="calculator-checkbox" style="cursor: pointer;">
            <input type="checkbox"
                  [checked]="calc.incluirIvaManual()"
                  (change)="calc.incluirIvaManual.set(!calc.incluirIvaManual())"
                  [disabled]="calc.pais() === 'CANARIAS'" />
            <span>
              @if (calc.pais() === 'ES') { Incluir IVA (21%) }
              @else if (calc.pais() === 'PT') { Incluir IVA (23%) }
              @else { Exento de IVA (Canarias) }
            </span>
          </label>

          <!-- Checkbox Instalación -->
          <label class="calculator-checkbox" style="opacity: 1; cursor: pointer;">
            <input type="checkbox"
                  [checked]="calc.instalacion()"
                  (change)="toggleInstalacion()" />
            <span>Incluir instalación (+50€)</span>
          </label>
        </div>

      </section>
    </fieldset>

    <!-- SECCIÓN: RESULTADO Y ACCIÓN -->
    <footer class="calculator-section calculator-section--submit">
      <button
        class="btn btn--primary calculator-submit"
        type="button"
        (click)="onSaveBudget()">
        Guardar Presupuesto
      </button>

      <div class="calculator-result" aria-live="polite">
        <span class="calculator-result__label">Presupuesto actual:</span>
        <output class="calculator-result__value">
          {{ calc.precioTotal() | currency:'EUR' }}
        </output>
      </div>
    </footer>

  </form>
</main>
