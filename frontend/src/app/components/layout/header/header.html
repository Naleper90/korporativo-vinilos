<header class="layout-header">

  <!-- LOGO -->
  <a routerLink="/" class="layout-header__logo" aria-label="Ir al inicio">
    Korporativo<span class="dot" aria-hidden="true">.</span>
  </a>

  <!-- BOTÓN HAMBURGUESA (Móvil) -->
  <button type="button" class="layout-header__hamburger"
          (click)="onToggleMobileMenu($event)"
          aria-label="Menú principal"
          [attr.aria-expanded]="isMobileMenuOpen">
    <span aria-hidden="true">☰</span>
  </button>

  <!-- NAVEGACIÓN PRINCIPAL (Escritorio) -->
  <nav class="layout-header__nav-desktop" aria-label="Navegación principal">
    <ul class="nav-list">
      <li><a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a></li>
      <li><a routerLink="/calculadora" routerLinkActive="is-active">Calculadora</a></li>
      <li><a routerLink="/contacto" routerLinkActive="is-active">Contacto</a></li>
    </ul>
  </nav>

  <!-- HERRAMIENTAS ESCRITORIO  -->
  <menu class="layout-header__actions">
    <li>
      <button type="button" class="btn-icon" (click)="onToggleTheme()"
              [attr.aria-label]="isDark ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'">
        <span aria-hidden="true">{{ isDark ? '🌞' : '🌙' }}</span>
      </button>
    </li>
    <li *ngIf="!authService.isLoggedIn()">
      <button type="button" class="layout-header__login-btn" (click)="onLogin()">
        <span class="icon" aria-hidden="true">👤</span> Entrar
      </button>
    </li>
    <ng-container *ngIf="authService.isLoggedIn()">
      <li>
        <a routerLink="/usuario" class="user-capsule" [attr.aria-label]="'Perfil de ' + authService.currentUser()?.username">
          <span class="user-avatar">{{ (authService.currentUser()?.username || 'U').charAt(0) | uppercase }}</span>
          <span class="user-name">{{ authService.currentUser()?.username }}</span>
        </a>
      </li>
      <li>
        <button type="button" class="btn-icon btn--logout" (click)="onLogout()" aria-label="Cerrar sesión">⏻</button>
      </li>
    </ng-container>
  </menu>

  <!-- MENÚ MÓVIL DESPLEGABLE -->
  <nav class="layout-header__nav-mobile" [class.is-open]="isMobileMenuOpen" aria-label="Menú móvil">
    <ul class="mobile-list">
        <li><a routerLink="/" (click)="closeMobileMenu()" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a></li>
        <li><a routerLink="/calculadora" (click)="closeMobileMenu()" routerLinkActive="is-active">Calculadora</a></li>
        <li><a routerLink="/contacto" (click)="closeMobileMenu()" routerLinkActive="is-active">Contacto</a></li>
    </ul>

    <hr class="mobile-divider">

    <menu class="mobile-actions">
        <!-- 1. TEMA MÓVIL -->
        <li>
            <button type="button" (click)="onToggleTheme()" class="mobile-btn mobile-theme-btn">
                <span aria-hidden="true">{{ isDark ? '🌞' : '🌙' }}</span>
                <span>{{ isDark ? 'Cambiar a Tema Claro' : 'Cambiar a Tema Oscuro' }}</span>
            </button>
        </li>

        <!-- 2. LOGIN / USUARIO -->
        <li *ngIf="!authService.isLoggedIn()">
            <button (click)="onLogin()" class="layout-header__login-btn layout-header__login-btn--mobile">Entrar</button>
        </li>

        <ng-container *ngIf="authService.isLoggedIn()">
            <li>
              <a routerLink="/usuario" (click)="closeMobileMenu()" class="mobile-user-link">
                  Hola, {{ authService.currentUser()?.username }}
              </a>
            </li>
            <li>
              <button type="button" (click)="onLogout()" class="mobile-btn mobile-logout">Cerrar sesión</button>
            </li>
        </ng-container>
    </menu>
  </nav>

</header>
