<header class="layout-header">
  <nav class="layout-header__nav layout__container" aria-label="Navegación principal">
    <!-- LOGO -->
    <a routerLink="/" class="layout-header__logo">Korporativo</a>

    <!-- HAMBURGER MENU (Móvil) -->
    <button
      type="button"
      class="layout-header__hamburger"
      aria-label="Abrir menú"
      (click)="onToggleMobileMenu($event)"
    >
      ☰
    </button>

    <!-- MENÚ DE NAVEGACIÓN (Escritorio) -->
    <ul class="layout-header__nav-list" role="list">
      <li><a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a></li>
      <li><a routerLink="/calculadora" routerLinkActive="is-active">Calculadora</a></li>
      <li><a routerLink="/contacto" routerLinkActive="is-active">Contacto</a></li>

      <!-- LÓGICA DE AUTENTICACIÓN (Escritorio) -->

      <!-- CASO 1: NO LOGUEADO -->
      <li *ngIf="!authService.isLoggedIn()">
        <button type="button" class="layout-header__login-btn" (click)="onLogin()">
          <span class="icon">👤</span> Entrar
        </button>
      </li>

      <!-- CASO 2: LOGUEADO -->
      <li *ngIf="authService.isLoggedIn()" class="user-menu-item">
        <!-- AHORA ES UN ENLACE AL ÁREA DE USUARIO -->
        <a routerLink="/usuario" class="user-greeting" style="text-decoration: none; cursor: pointer;">
          Hola, {{ authService.currentUser()?.username || authService.currentUser() }}
        </a>
        <button type="button" class="btn btn--text btn--logout" (click)="onLogout()">
          Salir
        </button>
      </li>

      <!-- TOGGLE THEME -->
      <li>
        <button type="button" class="btn btn--secondary layout-header__theme-toggle" (click)="onToggleTheme()">
          {{ isDark ? 'Tema claro' : 'Tema oscuro' }}
        </button>
      </li>
    </ul>

    <!-- MENÚ MÓVIL (Oculto por defecto) -->
    <ul #mobileMenu class="layout-header__nav-mobile" role="list">
      <li><a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a></li>
      <li><a routerLink="/calculadora" routerLinkActive="is-active">Calculadora</a></li>
      <li><a routerLink="/contacto" routerLinkActive="is-active">Contacto</a></li>

      <!-- LÓGICA DE AUTENTICACIÓN (Móvil) -->

      <!-- CASO 1: NO LOGUEADO -->
      <li *ngIf="!authService.isLoggedIn()">
        <button type="button" class="layout-header__login-btn layout-header__login-btn--mobile" (click)="onLogin()">
          Entrar
        </button>
      </li>

      <!-- CASO 2: LOGUEADO -->
      <li *ngIf="authService.isLoggedIn()">
        <!-- AHORA ES UN ENLACE AL ÁREA DE USUARIO -->
        <a routerLink="/usuario" style="display: block; margin-bottom: 0.5rem; color: var(--text-color); text-decoration: none;">
            Hola, {{ authService.currentUser()?.username || authService.currentUser() }}
        </a>
        <button type="button" class="btn btn--text" (click)="onLogout()">
          Cerrar sesión
        </button>
      </li>

      <li>
        <button type="button" class="btn btn--secondary layout-header__theme-toggle" (click)="onToggleTheme()">
          {{ isDark ? 'Tema claro' : 'Tema oscuro' }}
        </button>
      </li>
    </ul>
  </nav>
</header>
