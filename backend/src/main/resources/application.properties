# ==========================================
# CONFIGURACIÓN HÍBRIDA (LOCAL / RAILWAY)
# ==========================================

spring.application.name=korporativo-backend

# --- BASE DE DATOS ---
# Si Railway nos da DATABASE_URL, usamos Postgres. Si no, H2 en memoria.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:testdb}

# Usuario y Password (si no hay variables de entorno, usa 'sa' y vacío)
spring.datasource.username=${PGUSER:sa}
spring.datasource.password=${PGPASSWORD:}

# Driver: Spring Boot lo detecta solo, pero si quieres ser explícito:
# (En local H2, en prod Postgres)
# spring.datasource.driver-class-name=${JDBC_DRIVER:org.h2.Driver}

# --- JPA / HIBERNATE ---
# En local usamos 'create-drop' (borra al cerrar). En prod usamos 'update' (mantiene datos).
# Railway debe tener la variable DDL_AUTO=update. Localmente será create-drop.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}

# Dialecto: Postgres en prod, H2 en local.
# En Railway añade la variable HbDialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=${HbDialect:org.hibernate.dialect.H2Dialect}

spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- H2 CONSOLE (Solo para local) ---
spring.h2.console.enabled=true

# --- SWAGGER / OPENAPI ---
springdoc.api-docs.path=/v3/api-docs

# --- SERVIDOR ---
# Railway asigna el puerto dinámicamente con la variable PORT
server.port=${PORT:8080}
server.ssl.enabled=false
server.http2.enabled=true
server.error.include-message=always

# --- SEGURIDAD (JWT) ---
# ¡IMPORTANTE! En Railway define JWT_SECRET con una clave larga y segura.
jwt.secret=${JWT_SECRET:mySecretKeyForJWTTokenGenerationAndValidation1234567890}
jwt.expiration=86400000

# --- LOGS ---
logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE 
# (Comentado TRACE para no saturar logs en prod, descomenta si necesitas debug local)
